<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='assets/mov-icon.ico' rel='shortcut icon'>
  <title>Being, Between</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- moving background, drawn by background.js behind everything -->
  <div id="background" class="background"></div>

  <div class="container">
    <!-- Initial Connect Screen -->
    <div id="home" class="home">
      <h1 class="artwork-title">Being, Between</h1>
      <p>Place your finger on the sensor</p>
      <!-- <p>Put on the headphones, place your finger on the sensor and your hand on the top of the device.</p> -->
      <!-- only shown until the esp32 is paired, the browser remembers it after that -->
      <button id="connect-device" class="connect-btn device-btn">Connect device</button>
    </div>

    <!-- Video Interface -->
    <div id="video-interface" class="video-interface">
      <!-- Connecting Screen -->
      <div id="connecting-screen" class="connecting-screen">
        <div class="connecting-message">
          <p>Looking for someone...</p>
          <p>Please wear the headphones and keep your hand on the device</p>
          <div class="loading"></div>
          <img class="device-drawing" src="assets/device.svg" alt="A hand on the device, with the index finger on the red sensor">
        </div>
      </div>

      <!-- Video Container (hidden initially) -->
      <div id="video-container" class="video-container">
        <video id="remote-video" autoplay></video>
      </div>

      <div id="fake-video-container" class="video-container">
        <video id="fake-video" autoplay></video>
      </div>

      <!-- shown over both videos, script.js shows and hides it with them -->
      <p id="privacy-notice" class="privacy-notice">Your image and heartbeat are sent live to the other installation.<br>Nothing is recorded.</p>
    </div>

    <h2 id="finger-misplaced" class="finger-misplaced">Please keep your finger on the device</h2>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
  <script src="background.js"></script>
  <script src="script.js"></script>
</body>

</html>
